<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="50%" stop-color="#111B30"/>
      <stop offset="100%" stop-color="#070A14"/>
    </linearGradient>
    <linearGradient id="cyan_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EF2F5"/>
      <stop offset="100%" stop-color="#22B8BD"/>
    </linearGradient>
    <linearGradient id="violet_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#2A3B56" stroke-width="4" opacity="0.6"/>

  <!-- Subtle Circuit / Grid Accents -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1E293B" stroke-width="3"/>

  <!-- Holographic Echo Twin Ring (Violet, dashed temporal resonance) -->
  <path d="M 160 256 A 96 96 0 0 1 352 256" fill="none" stroke="url(#violet_grad)" stroke-width="18" stroke-linecap="round" stroke-dasharray="14 10" filter="url(#glow)"/>
  <circle cx="160" cy="256" r="14" fill="#A78BFA" filter="url(#glow)"/>

  <!-- Player Temporal Ring (Cyan) -->
  <path d="M 352 256 A 96 96 0 0 1 160 256" fill="none" stroke="url(#cyan_grad)" stroke-width="18" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="352" cy="256" r="14" fill="#54E6EA" filter="url(#glow)"/>

  <!-- Central Chrono Core (Amber Pulse Diamond) -->
  <g transform="translate(256, 256) rotate(45)">
    <rect x="-32" y="-32" width="64" height="64" rx="10" fill="#FFBE55" filter="url(#glow)"/>
    <rect x="-16" y="-16" width="32" height="32" rx="4" fill="#FFFBEB"/>
  </g>

  <!-- Visor Lines -->
  <line x1="256" y1="90" x2="256" y2="130" stroke="#54E6EA" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="382" x2="256" y2="422" stroke="#A78BFA" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="90" y1="256" x2="130" y2="256" stroke="#22B8BD" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="382" y1="256" x2="422" y2="256" stroke="#8B5CF6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
